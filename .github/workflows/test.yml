name: Test Suite

on:
  push:
    branches: [ master, main, develop, ci/security-controls-2026-10-16 ]
  pull_request:
    branches: [ master, main, develop ]

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

permissions:
  contents: read

jobs:
  test-frontend:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: next-frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd next-frontend
        npm ci

    - name: Run frontend unit tests
      run: |
        cd next-frontend
        npm run test

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./next-frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  test-server:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install server dependencies
      run: |
        cd server
        npm ci
    
    - name: Run server tests
      run: |
        cd server
        npm run test:coverage
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/test-npe-usa
        JWT_SECRET: test_jwt_secret
        CLIENT_URL: http://localhost:3000
    
    - name: Upload server coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./server/coverage/lcov.info
        flags: server
        name: server-coverage

  test-e2e:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright 1.58.2 noble, linux/amd64; browsers are preinstalled.
    container:
      image: mcr.microsoft.com/playwright@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd next-frontend && npm ci
        cd ../server && npm ci

    # Actions mounts /github/home with the host runner UID; Firefox rejects
    # a root browser process using a home owned by a different container user.
    - name: Align disposable container home ownership
      run: chown "$(id -u):$(id -g)" /github/home

    - name: Verify preinstalled browser version
      run: node scripts/ci/verify-browser-image.mjs

    - name: Run E2E tests
      run: |
        cd next-frontend
        npm run test:e2e
      env:
        CI: true
        NODE_ENV: test
        MONGODB_URI: mongodb://mongodb:27017/test-npe-usa
        # Disposable Actions service hostname inside the Playwright container only.
        MONGODB_DANGEROUSLY_ALLOW_REMOTE_HOSTS: mongodb
        JWT_SECRET: test_jwt_secret
        CLIENT_URL: http://localhost:3000
        PORT: 5001

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: next-frontend/playwright-report/
        retention-days: 30

  test-integration:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install server dependencies
      run: |
        cd server
        npm ci
    
    - name: Run integration tests
      run: |
        cd server
        npm run test:integration
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/test-npe-usa
        JWT_SECRET: test_jwt_secret
        CLIENT_URL: http://localhost:3000

  lint:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd next-frontend && npm ci

    - name: Run ESLint
      run: |
        cd next-frontend
        npm run lint
    
  browser-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install locked frontend packages without lifecycle scripts
      run: npm ci --ignore-scripts
      working-directory: next-frontend
    # Actions mounts /github/home with the host runner UID; Firefox rejects
    # a root browser process using a home owned by a different container user.
    - name: Align disposable container home ownership
      run: chown "$(id -u):$(id -g)" /github/home

    - name: Verify and launch all preinstalled browsers without external pages
      run: node scripts/ci/smoke-browser-image.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Verify audit collector behavior (offline)
      run: node --test scripts/ci/collect-security-audits.test.mjs scripts/ci/development-exception.test.mjs scripts/ci/wait-for-vercel-preview.test.mjs

    - name: Collect all audits and enforce existing gate
      run: node scripts/ci/collect-security-audits.mjs

    - name: Retain raw security evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-audits-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci-security/
        if-no-files-found: error
        retention-days: 30

  # Credential-bearing advisory scan is isolated from PR installs/tooling.
  # Protected-branch enforcement remains an external prerequisite.
  snyk-advisory:
    if: github.event_name == 'push' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Run Snyk security scan
      uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master resolved 2026-10-16
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true

  build:
    if: github.ref != 'refs/heads/ci/security-controls-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd next-frontend && npm ci
        cd ../server && npm ci

    - name: Build frontend
      run: |
        cd next-frontend
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: next-frontend-build
        path: next-frontend/.next/
        retention-days: 7
