# Post-deploy SSR regression: first-response HTML vs route-tier expectations.
# PRs require a successful preview for their exact head commit; main uses production.

name: SSR route audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to audit (no trailing slash)
        required: false
        default: https://www.nationalparksexplorerusa.com
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ssr-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  ssr-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd next-frontend && npm ci

      - name: Wait for Vercel preview (pull requests)
        if: github.event_name == 'pull_request'
        id: vercel-preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/wait-for-vercel-preview.mjs

      - name: Resolve BASE_URL
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.base_url }}
          VERCEL_URL: ${{ steps.vercel-preview.outputs.url }}
          VAR_URL: ${{ vars.SSR_AUDIT_BASE_URL }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_URL" ]; then
            URL="$DISPATCH_URL"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "$VERCEL_URL" ] || { echo "Missing exact-commit preview" >&2; exit 1; }
            URL="$VERCEL_URL"
          elif [ -n "$VAR_URL" ]; then
            URL="$VAR_URL"
          else
            URL="https://www.nationalparksexplorerusa.com"
          fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing: $URL"

      - name: Run SSR audit (strict)
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        run: cd next-frontend && npm run audit:ssr:strict
