# Trailie One-Brain — architecture enforcement (Steps 2–9).
# Deterministic, provider-disabled. No OpenAI / Google / NPS live calls.
name: Trailie One-Brain

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: trailie-one-brain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NODE_ENV: test
  JWT_SECRET: test_jwt_secret_one_brain
  CLIENT_URL: http://localhost:3000
  TRAILIE_TEST_PROVIDER_MODE: deny_live

permissions:
  contents: read

jobs:
  runtime-isolation:
    name: runtime-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Gate 1 — runtime selection
        run: npx jest src/config/__tests__/trailieRuntimeSelection.test.js --runInBand --coverage=false
        working-directory: server
      - name: Gate 2 — legacy require-time isolation
        run: node scripts/trace-model-first-legacy-reachability.js
        working-directory: server
      - name: Gate 2 — legacy isolation + cutover (throw-on-invoke)
        run: node scripts/run-provider-disabled-tests.js src/routes/__tests__/modelFirstLegacyIsolation.test.js src/routes/__tests__/modelFirstCutover.test.js --runInBand --coverage=false
        working-directory: server

  canonical-commit:
    name: canonical-commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            next-frontend/package-lock.json
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Install frontend
        run: npm ci
        working-directory: next-frontend
      - name: Gate 3 — guest/auth commit parity
        run: node scripts/run-provider-disabled-tests.js src/services/__tests__/trailieCanonicalCommitParity.test.js --runInBand --coverage=false
        working-directory: server
      - name: Gate 3 — cutover endpoints (create/refine/reject)
        run: node scripts/run-provider-disabled-tests.js src/routes/__tests__/modelFirstCutover.test.js --runInBand --coverage=false
        working-directory: server
      - name: Gate 3 — persisted:true no second client write
        run: npx vitest run src/utils/__tests__/modelFirstPersistence.test.js
        working-directory: next-frontend

  truth-boundary:
    name: truth-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Gate 4 — experience map-anchor truth
        run: node scripts/run-provider-disabled-tests.js src/utils/__tests__/experienceMapAnchorTruth.test.js src/services/__tests__/namedPlaceExperience.test.js --runInBand --coverage=false
        working-directory: server

  mcp-parity:
    name: mcp-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt
      - name: Install MCP
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
        working-directory: mcp-server
      - name: Gate 5 — MCP renderer-only + canonical parity
        run: .venv/bin/python -m pytest tests/test_mcp_renderer_only.py tests/test_canonical_parity.py tests/test_model_first_contract.py -q
        working-directory: mcp-server

  public-export-parity:
    name: public-export-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            next-frontend/package-lock.json
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Install frontend
        run: npm ci
        working-directory: next-frontend
      - name: Gate 6 — shared export boundary + share projection
        run: node scripts/run-provider-disabled-tests.js src/utils/__tests__/publicPlanExportBoundary.test.js src/utils/__tests__/oneBrainSemanticParity.test.js src/routes/__tests__/projectionBoundaries.test.js --runInBand --coverage=false
        working-directory: server
      - name: Gate 6 — frontend export / PDF consumers
        run: npx vitest run src/lib/__tests__/publicItineraryExport.test.js src/lib/__tests__/publicExportBoundaryParity.test.js src/lib/pdf/__tests__/buildTripExportPayload.test.js
        working-directory: next-frontend

  schema-version:
    name: schema-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            next-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Install frontend
        run: npm ci
        working-directory: next-frontend
      - name: Install MCP
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
        working-directory: mcp-server
      - name: Gate 7 — tripSchemaVersion contract
        run: node scripts/run-provider-disabled-tests.js src/utils/__tests__/tripSchemaVersion.test.js --runInBand --coverage=false
        working-directory: server
      - name: Gate 7 — version survives public export consumers
        run: npx vitest run src/lib/__tests__/publicExportBoundaryParity.test.js
        working-directory: next-frontend
      - name: Gate 7 — version survives MCP
        run: .venv/bin/python -m pytest tests/test_mcp_renderer_only.py -q
        working-directory: mcp-server

  sample-verification:
    name: sample-verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: next-frontend
      - name: Gate 9 — ten public Samples (no regeneration)
        run: npx vitest run src/lib/__tests__/oneBrainSamplesVerification.test.js src/lib/__tests__/trailieDemoCapture.test.js
        working-directory: next-frontend

  demo-contract:
    name: demo-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: next-frontend
      - name: Gate 10 — Demo exporter/renderer + currency flag
        run: npx vitest run src/lib/__tests__/oneBrainDemoContract.test.js src/lib/__tests__/trailieDemoPlayback.test.js
        working-directory: next-frontend

  one-brain-gate:
    name: Trailie One-Brain — PASS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - runtime-isolation
      - canonical-commit
      - truth-boundary
      - mcp-parity
      - public-export-parity
      - schema-version
      - sample-verification
      - demo-contract
    steps:
      - name: All architecture gates green
        run: |
          echo "Trailie One-Brain — PASS"
          echo "runtime-isolation, canonical-commit, truth-boundary,"
          echo "mcp-parity, public-export-parity, schema-version,"
          echo "sample-verification, demo-contract"
